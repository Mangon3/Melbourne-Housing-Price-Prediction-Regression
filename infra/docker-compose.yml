
services:
  stock-agent:
    image: ${IMAGE_NAME:-stockagent-stock-agent}:${IMAGE_TAG:-latest}
    network_mode: "host"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=localhost
      - REDIS_PORT=6379
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - MODEL=${MODEL}
    depends_on:
      - redis
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  prometheus:
    image: prom/prometheus:latest
    network_mode: "host"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    restart: unless-stopped

volumes:
  redis_data: