groups:
- name: stock_agent_alerts
  rules:
  - alert: InstanceDown
    expr: up == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Instance {{ $labels.instance }} down"
      description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 1 minute."

  - alert: HighErrorRate
    expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
    for: 2m
    labels:
      severity: high
    annotations:
      summary: "High HTTP Error Rate on {{ $labels.instance }}"
      description: "More than 5% of HTTP requests returned a 5xx error over the last 5 minutes."
